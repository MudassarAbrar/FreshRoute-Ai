<!DOCTYPE html>
<html lang="en">
<head>

<title>FreshRoute — Carousel 05 · The Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<body>
<div class="slide">
  <img class="bg" src="bg-05.png" alt="">

  <header class="bar">
    <div class="brand">
      <svg width="46" height="46" viewBox="0 0 64 64" fill="none">
        <defs>
          <linearGradient id="fr-logo-g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#1d9a5f"/>
            <stop offset="1" stop-color="#0c5c3a"/>

        <rect width="64" height="64" rx="16" fill="url(#fr-logo-g)"/>
        <path d="M20 42 C20 26 32 18 46 18 C46 34 36 44 22 44" fill="none" stroke="#eafff3" stroke-width="3.5" stroke-linecap="round"/>

      <div class="wordmark">FreshRoute</div>

    <div class="counter">05<span> / 07</span></div>

    <div class="kicker">YOUR AI TRADING AGENT</div>
    <h1 class="small">IT FINDS BUYERS.<br><span class="lime">YOU APPROVE.</span></h1>

      <div class="chip">

          <circle cx="13" cy="13" r="13" fill="#A8D68A"/>
          <path d="M7.5 13.5l3.4 3.4L18.5 9.5" stroke="#0E1F10" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Buyer matching
      </div>
      <div class="chip">
        <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
          <circle cx="13" cy="13" r="13" fill="#A8D68A"/>
          <path d="M7.5 13.5l3.4 3.4L18.5 9.5" stroke="#0E1F10" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Transport booking
      </div>
      <div class="chip">
        <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
          <circle cx="13" cy="13" r="13" fill="#A8D68A"/>
          <path d="M7.5 13.5l3.4 3.4L18.5 9.5" stroke="#0E1F10" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>

    </div>
    <div class="note">

      </svg>
      Nothing ships without your approval.

  <footer class="foot">
    <div class="progress"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i></div>
