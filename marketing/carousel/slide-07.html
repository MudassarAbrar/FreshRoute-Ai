<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FreshRoute — Carousel 07 · Early Access</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="slides.css">
</head>
<body>
<div class="slide">
  <img class="bg" src="bg-07.png" alt="">
  <div class="overlay"></div>

  <header class="bar">
    <div class="brand">
      <svg width="46" height="46" viewBox="0 0 64 64" fill="none">
        <defs>
          <linearGradient id="fr-logo-g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#1d9a5f"/>
            <stop offset="1" stop-color="#0c5c3a"/>
          </linearGradient>
        </defs>
        <rect width="64" height="64" rx="16" fill="url(#fr-logo-g)"/>
        <path d="M20 42 C20 26 32 18 46 18 C46 34 36 44 22 44" fill="none" stroke="#eafff3" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M20 44 C24 36 30 30 40 25" fill="none" stroke="#7fe0ae" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="1.5 5"/>
        <circle cx="44" cy="20" r="3.2" fill="#ffc94d"/>
      </svg>
      <div class="wordmark">FreshRoute</div>
    </div>
    <div class="counter">07<span> / 07</span></div>
  </header>

  <main class="content">
    <div class="kicker">EARLY ACCESS</div>
    <h1>BE THE FIRST TO<br><span class="lime">SELL SMARTER.</span></h1>
    <div class="cta-row">
      <div class="cta">JOIN EARLY ACCESS
        <svg width="30" height="26" viewBox="0 0 26 24" fill="none">
          <path d="M3 12h18M14 5l7 7-7 7" stroke="#FAF7EE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="cta-note">Free for the first season · Limited spots</div>
    </div>
  </main>

  <footer class="foot">
    <div class="progress"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></div>
    <div class="tagline">From harvest to payment — one conversation</div>
  </footer>
</div>
</body>
</html>
